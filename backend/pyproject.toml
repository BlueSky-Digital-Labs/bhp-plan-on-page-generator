[project]
name = "plan-on-a-page-backend"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.123",
    "defusedxml>=0.7.1",
    "fastapi>=0.162,<1",
    "fpdf2>=2.9.0",
    "pydantic-settings>=2.16,<3",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "python-pptx>=1.0.2",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "moto[dynamodb]>=5",
    "pytest>=9,<10",
    "ruff>=0.17,<1",
]

[tool.uv]
# An application, not an installable package: the code is run from app/.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
