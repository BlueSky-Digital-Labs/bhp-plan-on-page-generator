[project]
name = "plan-on-a-page-infra"
version = "0.0.0"
description = "AWS CDK app for the SCP AI Ideation assistant deployment"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib>=2.200,<3",
    "constructs>=10.4,<11",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.17,<1",
]

[tool.uv]
# An application, not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
