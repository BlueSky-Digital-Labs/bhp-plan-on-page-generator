name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
        working-directory: backend
      - run: uv run --frozen pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  browser-smoke:
    name: browser smoke (Chrome + Edge)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --no-dev
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chrome msedge
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t plan-on-a-page .
      - name: Container starts healthy as non-root, and fails fast without APP_ENV
        run: |
          [ "$(docker run --rm --entrypoint id plan-on-a-page -u)" != "0" ]
          ! docker run --rm plan-on-a-page >/dev/null 2>&1
          docker run -d --name app -e APP_ENV=deployed -p 8000:8000 plan-on-a-page
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] || { docker logs app; exit 1; }
          curl -fsS localhost:8000/api/health
          curl -fsS localhost:8000/ | grep -q '<div id="root">'
