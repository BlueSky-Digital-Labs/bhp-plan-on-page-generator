name: Destroy

# Removes an environment completely: the service stack, then the foundation (table, secrets,
# key, ECR, logs). Everything is disposable. The KMS key stays for its 7-day deletion window.
# Rebuild with the Deploy workflow, then set the access code again (docs/deployment.md).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        type: choice
        options: [test, prod]
        required: true
      confirm:
        description: "Type destroy-<environment> to confirm, for example destroy-test"
        type: string
        required: true

permissions:
  contents: read

# Shares the group with Deploy, so the two never run against one environment together.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  CDK_CLI_VERSION: 2.1147.0

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      # CDK validates every setting before it will synthesise, so pass the same ones as Deploy.
      # Empty means the default for the environment: minimal for test, full for prod.
      PROFILE: ${{ vars.PROFILE }}
      AVAILABILITY_ZONES: ${{ vars.AVAILABILITY_ZONES }}
      VPC_ID: ${{ vars.VPC_ID }}
      PUBLIC_SUBNET_IDS: ${{ vars.PUBLIC_SUBNET_IDS }}
      CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
      DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
      BEDROCK_RESOURCE_ARNS: ${{ vars.BEDROCK_RESOURCE_ARNS }}
      ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
      ENABLE_EMAIL: ${{ vars.ENABLE_EMAIL }}
      SES_IDENTITY_ARN: ${{ vars.SES_IDENTITY_ARN }}
      EMAIL_SENDER_ADDRESS: ${{ vars.EMAIL_SENDER_ADDRESS }}
      EMAIL_ALLOWED_DOMAINS: ${{ vars.EMAIL_ALLOWED_DOMAINS }}
      # CDK must synthesise the stacks to know what to delete; this value is never deployed.
      IMAGE_TAG: destroy
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy-${ENVIRONMENT}" ]; then
            echo "::error::Type exactly destroy-${ENVIRONMENT} in the confirm input. Nothing was changed."
            exit 1
          fi

      - uses: actions/checkout@v4

      # How this workflow signs in to AWS. AWS_AUTH (Environment variable): empty or `oidc` assumes
      # the short-lived deploy role over OIDC (recommended); `keys` uses the Environment secrets
      # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (and AWS_SESSION_TOKEN if the keys are temporary).
      - name: Check how to sign in to AWS
        env:
          AWS_AUTH: ${{ vars.AWS_AUTH }}
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          case "${AWS_AUTH:-oidc}" in
            oidc) ;;
            keys)
              [ -n "$KEY_ID" ] && [ -n "$KEY_SECRET" ] || {
                echo "::error::AWS_AUTH=keys needs the Environment secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY"
                exit 1
              } ;;
            *)
              echo "::error::AWS_AUTH must be empty, oidc or keys"
              exit 1 ;;
          esac

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_AUTH != 'keys' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/plan-github-deploy-${{ env.ENVIRONMENT }}
          role-session-name: plan-destroy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: ${{ vars.AWS_AUTH == 'keys' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Whichever way we signed in, never act on a different account than the one configured.
      - name: Confirm the AWS account
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          actual=$(aws sts get-caller-identity --query Account --output text)
          [ "$actual" = "$EXPECTED_ACCOUNT" ] || {
            echo "::error::the credentials are for a different AWS account than AWS_ACCOUNT_ID"
            exit 1
          }
          echo "Signed in to AWS account $actual"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: infra/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global "aws-cdk@${CDK_CLI_VERSION}"
      - run: uv sync --frozen
        working-directory: infra

      - name: Destroy service
        run: scripts/cdk-run.sh destroy "$ENVIRONMENT" service --force
      - name: Destroy foundation
        run: scripts/cdk-run.sh destroy "$ENVIRONMENT" foundation --force

      # CloudFormation deletes a secret with a 30-day recovery window, which would block
      # recreating the same name on the next deploy. Purge both now.
      - name: Purge the deleted secrets
        run: |
          for name in access-code-hash cookie-signing-key; do
            if ! err=$(aws secretsmanager delete-secret --secret-id "plan-${ENVIRONMENT}/${name}" \
              --force-delete-without-recovery 2>&1); then
              echo "::warning::plan-${ENVIRONMENT}/${name} was not purged (the next deploy fails until it is): ${err}"
            fi
          done

      # Safety net: a Lambda-backed custom resource would leave a log group CloudFormation does
      # not own. The stacks currently have none, so this normally finds nothing. Best effort.
      - name: Remove leftover Lambda log groups
        run: |
          groups=$(aws logs describe-log-groups --log-group-name-prefix "/aws/lambda/plan-${ENVIRONMENT}-" \
            --query 'logGroups[].logGroupName' --output text) || groups=
          for g in $groups; do
            aws logs delete-log-group --log-group-name "$g" || echo "::warning::could not delete $g"
          done

      - name: Verify nothing remains
        run: scripts/verify-destroyed.sh "$ENVIRONMENT" "$AWS_REGION"

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Destroy ${ENVIRONMENT}: ${{ job.status }}"
            echo
            echo "The KMS key is in its 7-day pending-deletion window (the AWS minimum) and"
            echo "disappears by itself; it costs nothing while pending. To bring the"
            echo "environment back, run Deploy, then set the access code with"
            echo "\`scripts/set-access-secrets.sh ${ENVIRONMENT}\`."
          } >> "$GITHUB_STEP_SUMMARY"
